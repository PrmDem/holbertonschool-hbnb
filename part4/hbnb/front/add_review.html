<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Review</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <img src="images/stiltzkin-logo.png" alt="HBnB logo" id="logo">
        <div class="website-name">
            <h1>CouBnB</h1>
            <h2>it sure beats a tent, kupo!</h2>
        </div>
        <button class="nav-link" type="button"><a href="index.html">Home</a></button>
        <button class="nav-link" type="button" id="login-link"><a href="login.html">Login</a></button>
        <button class="nav-link" type="button" id="logout-link"><a href="index.html">Logout</a></button>
        <button class="nav-link" type="button"><a href="credits.html">Credits</a></button>
    </header>
    <main>
        <!-- displays place's title and owner's first name -->
        <h2 id="review-where"></h2>
        <form id="review-form">
            <label for="review">Your Review:</label>
            <textarea id="review" name="review" required></textarea>
            <label for="pick-rating">Rating:</label>
            <select id="pick-rating" name="rating" required>
                <option label="1­ ✧">1</option>
                <option label="2­ ✧">2</option>
                <option label="3­ ✧">3</option>
                <option label="4­ ✧">4</option>
                <option label="5­ ✧">5</option>
            </select>
            <button type="submit">Submit Review</button>
            <img src="images/saving.png" width="175px">
        </form>
    </main>
    <footer>
        <p>© 2025 HBnB - All rights reserved.</p>
    </footer>
    <script type='module' src="js/add-review.js"></script>
</body>

</html>
