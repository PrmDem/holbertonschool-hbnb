<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <img src="images/stiltzkin-logo.png" alt="HBnB logo" id="logo">
        <div class="website-name">
            <h1>CouBnB</h1>
            <h2>it sure beats a tent, kupo!</h2>
        </div>
        <button class="nav-link" type="button"><a href="index.html">Home</a></button>
        <button class="nav-link" type="button" id="login-link"><a href="login.html">Login</a></button>
        <button class="nav-link" type="button"><a href="credits.html">Credits</a></button>
    </header>
    <main>
        <form id="login-form">
            <h2>Who are you again?</h2>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Login</button>
            <img src="images/saving.png" width="175px">
        </form>
    </main>
    <footer>
        <p class="disclaimer">© 2025 HBnB - All rights reserved.</p>
    </footer>
    <script src="js/login-form.js"></script>
</body>

</html>
