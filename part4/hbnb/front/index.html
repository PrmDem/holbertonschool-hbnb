<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to CouBnB !</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Header -->
    <header>
        <img src="images/stiltzkin-logo.png" alt="HBnB logo" id="logo">
        <div class="website-name">
            <h1>CouBnB</h1>
            <h2>it sure beats a tent, kupo!</h2>
        </div>
        <button class="nav-link" type="button"><a href="index.html">Home</a></button>
        <button class="nav-link" type="button" id="login-link"><a href="login.html">Login</a></button>
        <button class="nav-link hidden" type="button" id="logout-link"><a href="index.html">Logout</a></button>
        <button class="nav-link" type="button"><a href="credits.html">Credits</a></button>
    </header>
    <main>
        <section id="filter">
            <h2>Find your dream place</h2>
            <div class="hidden" id="filters">
                <label for="price-filter">Max Price:</label>
                <select id="price-filter">
                    <!-- Options will be populated dynamically -->
                </select>
                <label for="local-filter">Kingdom:</label>
                <select id="local-filter">
                    <option selected label="All">All</option>
                    <option label="Alexandria">25</option>
                    <option label="Lindblum">35</option>
                    <option label="Burmecia">45</option>
                    <option label="Other">80</option>
                </select>
            </div>
        </section>
        <article class="noPlace hidden" id="needLog">
            <img src="images/review-card.png">
            <blockquote class="none-msg">
                You need to log in to see the goods, kupo!
            </blockquote>
        </article>
        <section id="places-list"></section>
    </main>
    <footer>
        <p>© 2025 HBnB - All rights reserved.</p>
    </footer>
    <script type="module" src="index.js"></script>
</body>

</html>
